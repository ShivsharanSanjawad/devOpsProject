- name: Configure App EC2
  hosts: app
  become: true

  vars:
    mysql_mount_path: /data/mysql

  tasks:
    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        update_cache: true

    - name: Add Docker apt key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable
        state: present

    - name: Install Docker, Compose, and Nginx
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
          - nginx
        update_cache: true

    - name: Ensure docker is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create MySQL mount path
      file:
        path: "{{ mysql_mount_path }}"
        state: directory
        mode: "0755"

    - name: Find EBS device already mounted
      shell: lsblk -dpno NAME,MOUNTPOINT | awk '$2=="{{ mysql_mount_path }}" {print $1}' | head -1
      register: ebs_mounted
      changed_when: false

    - name: Find unformatted EBS device
      shell: |
        for disk in $(lsblk -dpno NAME,TYPE | awk '$2=="disk" {print $1}'); do
          if lsblk -no MOUNTPOINT "$disk" | grep -q '/'; then
            continue
          fi
          if lsblk -no FSTYPE "$disk" | grep -q .; then
            continue
          fi
          echo "$disk"
          break
        done
      register: ebs_unformatted
      changed_when: false

    - name: Find unmounted non-root disk
      shell: |
        for disk in $(lsblk -dpno NAME,TYPE | awk '$2=="disk" {print $1}'); do
          if lsblk -nrpo MOUNTPOINT "$disk" | grep -q '/'; then
            continue
          fi
          if lsblk -nrpo MOUNTPOINT "$disk" | grep -q .; then
            continue
          fi
          echo "$disk"
          break
        done
      register: ebs_unmounted
      changed_when: false

    - name: Select MySQL mount device
      set_fact:
        mysql_mount_device: "{{ (ebs_mounted.stdout | length > 0) | ternary(ebs_mounted.stdout, (ebs_unformatted.stdout | length > 0) | ternary(ebs_unformatted.stdout, ebs_unmounted.stdout)) }}"

    - name: Ensure MySQL device was found
      assert:
        that:
          - mysql_mount_device | length > 0
        fail_msg: "No suitable EBS device found for MySQL. Check volume attachment and lsblk output."

    - name: Create filesystem if missing
      filesystem:
        fstype: ext4
        dev: "{{ mysql_mount_device }}"
      when: ebs_unformatted.stdout | length > 0

    - name: Mount MySQL data volume
      mount:
        path: "{{ mysql_mount_path }}"
        src: "{{ mysql_mount_device }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Copy nginx.conf
      copy:
        src: "{{ playbook_dir }}/../../nginx.conf"
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: restarted
        enabled: true
